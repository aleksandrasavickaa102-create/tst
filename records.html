<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ========================================== -->
    <!-- НАВИГАЦИЯ С КНОПКОЙ ВОЙТИ                  -->
    <!-- ========================================== -->
    <nav class="main-nav">
        <ul class="nav-list">
            <li><a href="site1.html">Главная</a></li>
            <li><a href="Товары.html">Игры</a></li>
            <li><a href="Контакты.html">Контакты</a></li>
            <li><a href = "records.html">Рекорды</a></li>
        </ul>
        
        <!-- Кнопка "Войти" (показывается, если не авторизован) -->
        <button id="login-btn" class="login-btn">Войти</button>
        
        <!-- Профиль пользователя (показывается, если авторизован) -->
        <div id="user-menu" class="user-menu" style="display: none;">
            <span id="user-display-name" class="user-name">Пользователь</span>
            <button id="logout-btn" class="logout-btn-small">Выйти</button>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- МОДАЛЬНОЕ ОКНО АУТЕНТИФИКАЦИИ              -->
    <!-- ========================================== -->
    <div class="auth-modal" id="auth-modal">
        <div class="auth-modal-window">
            
            <!-- Кнопка закрытия -->
            <button class="modal-close" id="modal-close">✕</button>
            
            <!-- Заголовок -->
            <h2 class="auth-title">🔐 Добро пожаловать!</h2>
            
            <!-- Вкладки -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            
            <!-- Форма входа -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль:</label>
                    <input type="password" id="login-password" placeholder="••••••" required>
                </div>
                <button type="submit" class="auth-btn">Войти</button>
            </form>
            
            <!-- Форма регистрации -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-name">Имя:</label>
                    <input type="text" id="register-name" placeholder="Ваше имя" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Пароль (мин. 6 символов):</label>
                    <input type="password" id="register-password" placeholder="••••••" minlength="6" required>
                </div>
                <button type="submit" class="auth-btn">Зарегистрироваться</button>
            </form>
            
        </div>
    </div>    
    <!-- ========================================== -->
<!-- ЛИДЕРБОРД (ТАБЛИЦА РЕКОРДОВ)               -->
<!-- ========================================== -->
<section class="leaderboard-section">
    <h2>🏆 Таблица рекордов</h2>
    
    <!-- Форма добавления рекорда -->
    <form id="score-form" class="score-form">
        <div class="form-row">
            <div class="form-group">
                <label for="player-name">Имя игрока:</label>
                <input type="text" id="player-name" placeholder="Ваше имя" required>
            </div>
            <div class="form-group">
                <label for="player-score">Очки:</label>
                <input type="number" id="player-score" placeholder="1000" min="0" required>
            </div>
            <div class="form-group">
                <label for="game-title">Игра:</label>
                <select id="game-title" required>
                    <option value="">Выберите игру</option>
                    <option value="Cyberpunk 2077">Cyberpunk 2077</option>
                    <option value="Dota 2">Dota 2</option>
                    <option value="PUBG: BATTLEGROUNDS">PUBG: BATTLEGROUNDS</option>
                </select>
            </div>
            <button type="submit" class="score-btn">➕ Добавить</button>
        </div>
    </form>
    
    <!-- Фильтр по игре -->
    <div class="leaderboard-filter">
        <label for="leaderboard-game-filter">Фильтр по игре:</label>
        <select id="leaderboard-game-filter">
            <option value="">Все игры</option>
            <option value="Cyberpunk 2077">Cyberpunk 2077</option>
            <option value="Dota 2">Dota 2</option>
            <option value="PUBG: BATTLEGROUNDS">PUBG: BATTLEGROUNDS</option>
        </select>
    </div>
    
    <!-- Таблица рекордов -->
    <div class="leaderboard-table-wrapper">
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Место</th>
                    <th>Игрок</th>
                    <th>Очки</th>
                    <th>Игра</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr>
                    <td colspan="4" style="text-align: center;">Загрузка...</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

</body>
</html>
